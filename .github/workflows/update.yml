name: Обновление графика

# Запуск: каждый будний день в 16:17 МСК (13:17 UTC) + ручная кнопка.
# GitHub cron работает в UTC; время намеренно не «ровное» — так меньше
# задержек из-за пиковой нагрузки планировщика Actions.
on:
  schedule:
    - cron: "17 13 * * 1-5"
  workflow_dispatch: {}

# Права: коммит обновлённой базы обратно в репозиторий + публикация на Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Не даём двум запускам публиковать Pages одновременно.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сбор данных и сборка графика
        run: |
          python3 collect.py --retries 5 --retry-delay 60
          python3 build_chart.py

      - name: Коммит обновлённой базы и графика
        run: |
          git config user.name  "matryoshka-bot"
          git config user.email "actions@users.noreply.github.com"
          git add matryoshka.db chart.html
          git commit -m "data: автообновление $(date -u +%F)" || echo "изменений нет"
          git push

      - name: Подготовка сайта для Pages
        run: |
          mkdir -p _site
          cp chart.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
